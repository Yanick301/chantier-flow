worker_processes 1;
pid /tmp/nginx_chantier_flow.pid;
error_log /tmp/nginx_chantier_flow_error.log;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /tmp/nginx_chantier_flow_access.log;

    client_body_temp_path /tmp/nginx_chantier/body;
    proxy_temp_path /tmp/nginx_chantier/proxy;
    fastcgi_temp_path /tmp/nginx_chantier/fastcgi;
    uwsgi_temp_path /tmp/nginx_chantier/uwsgi;
    scgi_temp_path /tmp/nginx_chantier/scgi;

    sendfile on;

    server {
        listen 8080;
        server_name _;

        client_max_body_size 10M;

        root /home/all/Bureau/compta/client/dist;
        index index.html;

        location /api/ {
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /uploads/ {
            proxy_pass http://127.0.0.1:3001;
            proxy_set_header Host $host;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
