<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af"/>
      <stop offset="100%" style="stop-color:#0c4a6e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <g transform="translate(256,256)">
    <!-- Building/House icon -->
    <path d="M-80,-20 L0,-100 L80,-20 L80,80 L-80,80 Z" fill="none" stroke="white" stroke-width="12" stroke-linejoin="round"/>
    <!-- Door -->
    <rect x="-20" y="20" width="40" height="60" rx="4" fill="none" stroke="white" stroke-width="8"/>
    <!-- Windows -->
    <rect x="-60" y="0" width="24" height="24" rx="3" fill="none" stroke="white" stroke-width="8"/>
    <rect x="36" y="0" width="24" height="24" rx="3" fill="none" stroke="white" stroke-width="8"/>
    <!-- Dollar/FCFA sign -->
    <text x="0" y="-50" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-weight="700" font-size="28">FCFA</text>
  </g>
</svg>
